name: Random Daily Agent

on:
  schedule:
    # يعمل 4 مرات يومياً في أوقات مختلفة
    - cron: '0 4 * * *'  # 7 صباحاً بتوقيتك
    - cron: '0 9 * * *'  # 12 ظهراً
    - cron: '0 14 * * *' # 5 مساءً
    - cron: '0 19 * * *' # 10 مساءً
  workflow_dispatch: # زر للتشغيل اليدوي للاختبار

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai requests

      - name: 🎲 Random Delay (0 to 60 mins)
        # الانتظار لوقت عشوائي حتى لا تكون الرسالة متوقعة
        run: |
          DELAY=$(( RANDOM % 3600 ))
          echo "Waiting for $DELAY seconds to surprise the user..."
          sleep $DELAY

      - name: 🚀 Run Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
