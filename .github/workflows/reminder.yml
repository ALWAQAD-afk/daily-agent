name: Random Daily Agent

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai requests

      - name: 🎲 Random Delay (0-40 mins)
        run: |
          DELAY=$(( RANDOM % 2400 ))
          echo "Waiting for $DELAY seconds..."
          sleep $DELAY

      - name: 🚀 Run Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python bot.py

      - name: 💾 Save memory if changed
        run: |
          git config user.name "daily-agent[bot]"
          git config user.email "daily-agent[bot]@users.noreply.github.com"
          git add memory.json
          if git diff --staged --quiet; then
            echo "No memory changes"
          else
            git commit -m "chore: update memory from agent run"
            git push
            echo "Memory committed"
          fi
