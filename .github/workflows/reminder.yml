name: Random Daily Agent

on:
  schedule:
    # كل 12 دقيقة تقريباً (يعطي تقريباً 3-7 مرات في الساعة مع العشوائية)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai requests

      - name: Random small delay (0-8 minutes)
        run: |
          DELAY=$(( RANDOM % 480 ))
          echo "Waiting $DELAY seconds..."
          sleep $DELAY

      - name: Run Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python bot.py

      - name: Commit memory if changed
        run: |
          git config user.name "daily-agent[bot]"
          git config user.email "daily-agent[bot]@users.noreply.github.com"
          git add memory.json profile.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update memory" || true
            git push || true
          fi
